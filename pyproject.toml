[project]
name = "context-debug"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "questionary>=2.1.1",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
